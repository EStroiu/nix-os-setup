[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 823.0
    cy = 847.0
    output = "eDP-1"
    placement_height = 1029.0
    placement_width = 1646.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Dracula"
community_palette = "ADW"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-fruit-salad"
pure_black_dark = true

[wallpaper.default]
path = "/nix/store/ma10nhgvri1y6pdl5vj4yn5j909xvdly-noctalia-5.1.0/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/ma10nhgvri1y6pdl5vj4yn5j909xvdly-noctalia-5.1.0/share/noctalia/assets/noctalia-wallpaper.png"

[[wallpaper.favorite]]
builtin_palette = "Ayu"
palette_source = "builtin"
path = "/nix/store/ma10nhgvri1y6pdl5vj4yn5j909xvdly-noctalia-5.1.0/share/noctalia/assets/noctalia-wallpaper.png"
