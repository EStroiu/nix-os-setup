[backdrop]
enabled = true

[bar.default]
background_opacity = 0.0
capsule = true
capsule_fill = "surface"
capsule_padding = 9.0
capsule_thickness = 0.79999998584389687
center = [ "clock", "date" ]
end = [ "network", "bluetooth", "volume", "brightness", "battery", "session" ]
font_family = "JetBrains Mono"
font_scale = 1.0499999839812517
scale = 1.0500000081956387
shadow = false
start = [ "launcher", "cpu", "ram", "workspaces" ]
thickness = 35
widget_spacing = 10

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
shadow = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 823.0
    cy = 847.0
    output = "eDP-1"
    placement_height = 1029.0
    placement_width = 1646.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "JetBrains Mono"
lang = "en"
popup_shadows = false

    [shell.panel]
    clipboard_placement = "attached"
    control_center_placement = "floating"
    session_placement = "floating"
    shadow = false

    [shell.shadow]
    alpha = 0.0

[theme]
builtin = "Dracula"
community_palette = "ADW"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-fruit-salad"

[wallpaper]
transition = [ "honeycomb" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/remarka/Pictures/nix_os_1.png"

    [wallpaper.last]
    path = "/home/remarka/Pictures/nix_os_1.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/remarka/Pictures/nix_os_1.png"

    [[wallpaper.favorite]]
    builtin_palette = "Ayu"
    palette_source = "builtin"
    path = "/nix/store/ma10nhgvri1y6pdl5vj4yn5j909xvdly-noctalia-5.1.0/share/noctalia/assets/noctalia-wallpaper.png"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    community_palette = "ADW"
    palette_source = "community"
    path = "/home/remarka/Pictures/nix_os_1.png"
    theme_mode = "dark"

[widget.clipboard]
capsule_radius = 8

[widget.control-center]
enabled = true

[widget.session]
capsule = true
capsule_radius = 8
